name: Test PRs goint to main then deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      # checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # setup node environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # install project dependencies
      - name: Install dependencies
        run: npm ci

      # execute test cases
      - name: Run tests
        run: npm run test -- --run

      # build the react portfolio
      - name: Build project
        run: npm run build